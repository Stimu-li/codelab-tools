version: '3.8'

services:
  # Development environment with all tools
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - go-cache:/go/pkg/mod
      - node-modules:/workspace/node_modules
    working_dir: /workspace
    ports:
      - "9090:9090"  # CLaaT serve port
      - "8080:8080"  # Catalog serve port
    command: /bin/sh
    stdin_open: true
    tty: true

  # CLaaT CLI service
  claat:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./sample-codelabs:/workspace/codelabs:ro
      - ./output:/workspace/output
    working_dir: /workspace
    ports:
      - "9090:9090"
    command: serve -addr 0.0.0.0:9090

  # Static file server for catalog
  catalog:
    image: nginx:alpine
    volumes:
      - ./catalog:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - claat

volumes:
  go-cache:
  node-modules:
